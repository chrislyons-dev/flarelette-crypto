name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish @chrislyons-dev/flarelette-crypto
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Run full check suite before publishing — fail fast, never publish broken code
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build -w packages/flarelette-crypto-ts

      # Verify the release tag matches the version in package.json
      - name: Verify version matches release tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/flarelette-crypto-ts/package.json').version")
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          # Strip leading 'v' from tag if present (v0.3.0 → 0.3.0)
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "❌ Release tag '${RELEASE_TAG}' does not match package version 'v${PACKAGE_VERSION}'"
            exit 1
          fi
          echo "✅ Release tag matches package version: ${RELEASE_TAG}"

      - name: Publish
        run: npm publish -w packages/flarelette-crypto-ts --provenance --access public
